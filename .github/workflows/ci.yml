# Builds, typechecks and tests every app on each PR and on pushes to dev/main.
# Branch protection requires the "check" job to pass before merging (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build, typecheck and test every app (regenerating assets)
        run: tools/check.sh

      - name: Report generated assets that differ from the commit
        # Informational: renders can differ by a pixel across platforms (libm), and releases are built from the
        # committed, device-tested assets. Rebuild locally and commit if an app's generator changed.
        run: |
          if git diff --quiet -- 'apps/*/app/src' 'apps/*/app/shared/generated'; then
            echo "Generated assets match the commit."
          else
            echo "::notice::Regenerated assets differ from the commit:"
            git diff --stat -- 'apps/*/app/src' 'apps/*/app/shared/generated'
          fi

      - name: Build from committed assets (what a release ships)
        run: git checkout -- . && tools/check.sh --no-prebuild
